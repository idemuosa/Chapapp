version: '3.8'

services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_NAME:-chatapp}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
    restart: always

  redis:
    image: redis:7-alpine
    restart: always

  backend:
    build: ./backend
    command: sh -c "python manage.py collectstatic --noinput && gunicorn core.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
    environment:
      - DATABASE_URL=postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-chatapp}
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=${DJANGO_SECRET_KEY}
      - DEBUG=${DEBUG:-False}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - USE_AWS=${USE_AWS:-False}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_STORAGE_BUCKET_NAME=${AWS_STORAGE_BUCKET_NAME}
      - AWS_S3_REGION_NAME=${AWS_S3_REGION_NAME:-us-east-1}
    depends_on:
      - db
      - redis
    restart: always

  realtime:
    build: ./realtime
    environment:
      - REDIS_URL=redis://redis:6379
      - DJANGO_API_URL=http://backend:8000/api/messages/
      - JWT_SECRET=${DJANGO_SECRET_KEY}
    depends_on:
      - redis
    restart: always

  frontend-build:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        - REACT_APP_API_URL=${REACT_APP_API_URL:-}
        - REACT_APP_SOCKET_URL=${REACT_APP_SOCKET_URL:-}
    image: chatapp-frontend:latest
    # This service just builds the image, it doesn't need to run continuously if we use it in nginx
    # But for compose, we'll let nginx use the same image or build context

  nginx:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.nginx
      args:
        - REACT_APP_API_URL=${REACT_APP_API_URL:-}
        - REACT_APP_SOCKET_URL=${REACT_APP_SOCKET_URL:-}
    ports:
      - "80:80"
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
    depends_on:
      - backend
      - realtime
    restart: always

volumes:
  postgres_data:
  static_volume:
  media_volume:
